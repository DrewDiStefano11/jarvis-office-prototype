name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Clean Install
      run: npm ci

    - name: Type Check
      run: npx tsc --noEmit

    - name: Lint
      run: npm run lint --if-present || npx eslint .

    - name: Test
      run: npx vitest run

    - name: Verify Floor 1 generated artifacts
      run: npm run check:floor1-generated

    - name: Verify generated sprite artifacts
      run: npm run check:sprites-generated

    - name: Build
      run: npm run build

    - name: Verify development surfaces are excluded
      run: npm run check:production-bundle
